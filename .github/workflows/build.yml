name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      # 配布条件のわからん PC-9800 フォントを public なアーティファクトで配らんよう、ここはフォントなし
      - name: Build (arm64 + x86_64)
        id: build
        env:
          NO_PC98_FONT: "1"
        run: |
          set -o pipefail
          ./build.sh 2>&1 | tee build.log

      - name: Check universal binary
        run: |
          APP="$(ls -d build/*.app)"
          echo "$APP"
          [ "$(basename "$APP")" = "SEDITメモ帳.app" ] || { echo "::error::名前が SEDITメモ帳 になってない: $APP" >&2; exit 1; }
          if [ -e "$APP/Contents/Resources/StatusLogo.png" ]; then echo "::error::ふつうのビルドに StatusLogo.png が入ってる" >&2; exit 1; fi
          ARCHS_FOUND="$(lipo -archs "$APP/Contents/MacOS/Memocho")"
          echo "$ARCHS_FOUND"
          for ARCH in arm64 x86_64; do
            case " $ARCHS_FOUND " in
              *" $ARCH "*) ;;
              *) echo "::error::$ARCH が入ってない" >&2; exit 1 ;;
            esac
          done

      - name: Check icon
        run: |
          iconutil --convert iconset --output "$RUNNER_TEMP/AppIcon.iconset" Resources/AppIcon.icns
          ls "$RUNNER_TEMP/AppIcon.iconset"

      - name: Zip app
        if: success()
        run: ditto -c -k --keepParent "$(ls -d build/*.app)" Memocho.zip

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: Memocho-app
          path: Memocho.zip
          if-no-files-found: error

      # 大きさと起動の速さ（参考。ここが失敗してもビルドは失敗にせん）。ランナーは Apple シリコンなので arm64 の分
      - name: Size and launch time
        continue-on-error: true
        timeout-minutes: 5
        run: |
          APP="$(ls -d build/*.app)"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' -c 'Print :NSHumanReadableCopyright' "$APP/Contents/Info.plist"
          du -sk "$APP"
          ls -l "$APP/Contents/MacOS/Memocho" "$APP/Contents/Resources"
          for ARCH in arm64 x86_64; do
            lipo -thin "$ARCH" -output "$RUNNER_TEMP/Memocho-$ARCH" "$APP/Contents/MacOS/Memocho"
            echo "$ARCH: $(stat -f %z "$RUNNER_TEMP/Memocho-$ARCH") B"
          done
          xcrun swiftc -O -o "$RUNNER_TEMP/launch-time" tools/launch-time.swift
          "$RUNNER_TEMP/launch-time" "$APP" 6
          # SEDIT 風 + 行番号 + 桁ルーラーのときの、ルーラーと本文の並び方
          defaults write local.memocho.sedit SeditMode -bool YES
          defaults write local.memocho.sedit ShowLineNumbers -bool YES
          defaults write local.memocho.sedit ShowColumnRuler -bool YES
          MEMOCHO_PROBE_GEOMETRY=1 "$RUNNER_TEMP/launch-time" "$APP" 1 || true
          defaults delete local.memocho.sedit || true

      # 大きさ優先の最適化（-Osize）にしたらどれだけ小さくなるか（参考、アップロードせん）
      - name: Size with -Osize (reference)
        continue-on-error: true
        env:
          NO_PC98_FONT: "1"
          SWIFT_OPT: "-Osize"
        run: |
          set -o pipefail
          ./build.sh > /dev/null
          for ARCH in arm64 x86_64; do
            lipo -thin "$ARCH" -output "$RUNNER_TEMP/Memocho-Osize-$ARCH" "$(ls -d build/*.app)/Contents/MacOS/Memocho"
            echo "-Osize $ARCH: $(stat -f %z "$RUNNER_TEMP/Memocho-Osize-$ARCH") B"
          done
          "$RUNNER_TEMP/launch-time" "$(ls -d build/*.app)" 6

      # 手元だけの見た目（PRIVATE=1、Resources/Private/）で作れるか。中身は CI だけの仮のもの（アップロードせん）
      - name: Build with a private look (arm64 only)
        env:
          ARCHS: arm64
          NO_PC98_FONT: "1"
          PRIVATE: "1"
        run: |
          set -o pipefail
          mkdir -p Resources/Private
          printf 'BRAND_NAME="CIテスト"\nBRAND_DESCRIPTION="CI test & <escape>"\nBRAND_BUNDLE_ID="local.memocho.citest"\n' > Resources/Private/brand.sh
          cp docs/sedit.png Resources/Private/StatusLogo.png
          # アイコンの差し替えも確かめる（中身はふつうのを 1 バイト変えたもの）
          python3 -c 'import sys; d=bytearray(open("Resources/AppIcon.icns","rb").read()); d[-1]^=1; open("Resources/Private/AppIcon.icns","wb").write(d)'
          ./build.sh 2>&1 | tee build.log
          APP="build/CIテスト.app"
          cmp "$APP/Contents/Resources/AppIcon.icns" Resources/Private/AppIcon.icns
          [ -d "$APP" ] || { echo "::error::PRIVATE=1 で名前が brand.sh のになってない" >&2; ls build; exit 1; }
          [ "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Contents/Info.plist")" = "local.memocho.citest" ]
          [ "$(/usr/libexec/PlistBuddy -c 'Print :NSHumanReadableCopyright' "$APP/Contents/Info.plist")" = "CI test & <escape>" ]
          [ -f "$APP/Contents/Resources/StatusLogo.png" ] || { echo "::error::StatusLogo.png が入ってない" >&2; exit 1; }
          codesign --verify --strict --verbose=1 "$APP"
          rm -rf Resources/Private

      # フォントを落として埋め込む流れと、埋め込んだあとの署名が通るか（こっちはアップロードせん）
      - name: Build with PC-9800 font (arm64 only)
        env:
          ARCHS: arm64
        run: |
          set -o pipefail
          ./build.sh 2>&1 | tee build.log
          FONT="$(ls -d build/*.app)/Contents/Resources/Fonts/pc-9800.ttf"
          if [ -f "$FONT" ]; then
            codesign --verify --strict --verbose=1 "$(ls -d build/*.app)"
          else
            echo "::warning::PC-9800 フォントが埋め込まれてない（retro-type.com から取れなかった？）"
          fi

      # README の画面写真（PC-9800 フォント込みのビルドで、アプリが自分のウィンドウを PNG にする）。アーティファクトにだけ置く
      - name: Screenshots
        continue-on-error: true
        timeout-minutes: 5
        run: |
          APP="$(ls -d build/*.app)"
          OUT="$RUNNER_TEMP/screenshots"
          mkdir -p "$OUT" ~/Desktop
          cp tools/screenshot/MEMO.TXT tools/screenshot/README.TXT tools/screenshot/LONG.TXT ~/Desktop/
          shoot() {
            NAME="$1"; TEXT="$2"; SIZE="$3"; shift 3
            defaults delete local.memocho.sedit >/dev/null 2>&1 || true
            for SETTING in "$@"; do defaults write local.memocho.sedit $SETTING; done
            perl -e 'alarm shift; exec @ARGV' 20 open -W -n -F --env MEMOCHO_LAUNCH_PROBE=1 \
              --env "MEMOCHO_SCREENSHOT=$OUT/$NAME.png" --env "MEMOCHO_SCREENSHOT_TEXT=$TEXT" \
              --env "MEMOCHO_SCREENSHOT_SIZE=$SIZE" --env MEMOCHO_PROBE_GEOMETRY=1 \
              --stderr "$OUT/$NAME.log" "$APP" || echo "$NAME: 20 秒で終わらんかった"
            ls -l "$OUT/$NAME.png" || true
            grep geometry "$OUT/$NAME.log" | sed "s/^/$NAME /" || true
          }
          shoot sedit ~/Desktop/MEMO.TXT 688x420 "SeditMode -bool YES" "ShowLineNumbers -bool YES" "ShowColumnRuler -bool YES" "WordWrap -bool YES"
          shoot mac ~/Desktop/MEMO.TXT 560x380 "MonospaceMode -bool YES" "ShowLineNumbers -bool YES" "WordWrap -bool YES"
          shoot win2000 ~/Desktop/README.TXT 520x300 "ClassicUI -bool YES" "HideMacMenuBar -bool NO" "WordWrap -bool YES"
          # 折り返しで右が切れんか（長い行・行番号・桁ルーラー）
          shoot wrap-mac ~/Desktop/LONG.TXT 500x300 "WordWrap -bool YES" "ShowLineNumbers -bool YES" "ShowColumnRuler -bool YES"
          shoot wrap-sedit ~/Desktop/LONG.TXT 500x300 "SeditMode -bool YES" "WordWrap -bool YES" "ShowLineNumbers -bool YES" "ShowColumnRuler -bool YES"
          shoot wrap-sedit-nonum ~/Desktop/LONG.TXT 500x300 "SeditMode -bool YES" "WordWrap -bool YES"
          # 折り返すときは、本文の幅が見えてる幅（クリップビュー）とそろってるか
          for NAME in wrap-mac wrap-sedit wrap-sedit-nonum; do
            CLIP="$(grep -o 'clip.frame ([^)]*)' "$OUT/$NAME.log" | awk -F'[(), ]+' '{print $4}')"
            TEXT="$(grep -o 'textView.frame ([^)]*)' "$OUT/$NAME.log" | awk -F'[(), ]+' '{print $4}')"
            if [ "$CLIP" = "$TEXT" ]; then echo "$NAME: 本文の幅 $TEXT = 見えてる幅 $CLIP"; else echo "::error::$NAME: 本文の幅 $TEXT と見えてる幅 $CLIP がちがう"; fi
          done
          defaults delete local.memocho.sedit >/dev/null 2>&1 || true

      - uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: ${{ runner.temp }}/screenshots
          if-no-files-found: warn

      # ./build.sh install both: ふつうのと手元だけの見た目のが、同じバージョン・別の ID で /Applications に並んで入るか
      - name: Build and install both (arm64 only)
        env:
          ARCHS: arm64
          NO_PC98_FONT: "1"
        run: |
          set -o pipefail
          mkdir -p Resources/Private
          printf 'BRAND_NAME="CIテスト"\nBRAND_DESCRIPTION="CI test"\nBRAND_BUNDLE_ID="local.memocho.citest"\n' > Resources/Private/brand.sh
          ./build.sh install both 2>&1 | tee build.log
          for NAME in "SEDITメモ帳" "CIテスト"; do
            PLIST="/Applications/$NAME.app/Contents/Info.plist"
            echo "$NAME: $(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$PLIST") $(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$PLIST")"
          done
          A="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "/Applications/SEDITメモ帳.app/Contents/Info.plist")"
          B="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "/Applications/CIテスト.app/Contents/Info.plist")"
          [ "$A" = "$B" ] || { echo "::error::バージョンがそろってない: $A / $B" >&2; exit 1; }
          rm -rf "/Applications/SEDITメモ帳.app" "/Applications/CIテスト.app" Resources/Private

      - name: Post compiler errors to PR
        if: failure() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          touch build.log
          # error: の行と、その下のソース行・キャレット行を拾う。arm64 と x86_64 で同じものが出るので重複は消す
          awk '
            /: error: / { n = 3 }
            n > 0 { print; n--; if (n == 0) print "" }
          ' build.log | awk 'BEGIN { RS = ""; ORS = "\n\n" } !seen[$0]++' > errors.txt
          {
            echo "### ビルド失敗 (\`${SHA:0:7}\`)"
            echo
            echo "$(grep -c ': error: ' errors.txt || true) 件の error（arm64 / x86_64 の重複は除いた） — [ログ]($RUN_URL)"
            echo
            echo '```'
            if [ -s errors.txt ]; then
              head -c 55000 errors.txt
            else
              echo "(error: の行なし。ログの末尾)"
              tail -n 60 build.log
            fi
            echo '```'
          } > comment.md
          gh api "repos/${{ github.repository }}/issues/$PR/comments" -F body=@comment.md > /dev/null
